services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zaneco_appointments
      POSTGRES_USER: zaneco
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - zaneco-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaneco -d zaneco_appointments"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://zaneco:secret@postgres:5432/zaneco_appointments
      - CHOKIDAR_USEPOLLING=1
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3500:3500"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_PROXY=http://backend:8000
      - CHOKIDAR_USEPOLLING=1
    depends_on:
      - backend

volumes:
  zaneco-pg-data:
